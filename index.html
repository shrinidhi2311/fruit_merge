    <script>
        /**
         * ============================================================================
         * 1. FRUIT DEFINITIONS & CUSTOM VECTOR ARTWORK RENDERER
         * ============================================================================
         * 11-tier evolution chain calibrated to a logical 400x600 coordinate space.
         * All rendering is scaled smoothly to match any phone screen resolution.
         */
        const LOGICAL_WIDTH = 400;
        const LOGICAL_HEIGHT = 600;
        const WALL_THICKNESS = 40;
        const DROP_Y = 58;
        const DANGER_LINE_Y = 115;

        const FRUITS = [
            { tier: 0, name: 'Cherry',     radius: 15, score: 1,   color: '#e62e3d', dark: '#a81824', light: '#ff7582' },
            { tier: 1, name: 'Strawberry', radius: 21, score: 3,   color: '#ff4757', dark: '#c22534', light: '#ff8a94' },
            { tier: 2, name: 'Grape',      radius: 28, score: 6,   color: '#8c52ff', dark: '#5a28bd', light: '#b794ff' },
            { tier: 3, name: 'Dekopon',    radius: 35, score: 10,  color: '#ffa502', dark: '#cc7a00', light: '#ffd166' },
            { tier: 4, name: 'Orange',     radius: 43, score: 15,  color: '#ff6b1a', dark: '#c74600', light: '#ffa36c' },
            { tier: 5, name: 'Apple',      radius: 52, score: 21,  color: '#eb3b3b', dark: '#a81d1d', light: '#ff7b7b' },
            { tier: 6, name: 'Pear',       radius: 61, score: 28,  color: '#d4e157', dark: '#9aa825', light: '#eff79c' },
            { tier: 7, name: 'Peach',      radius: 71, score: 36,  color: '#ff8fa3', dark: '#d65a72', light: '#ffc2cd' },
            { tier: 8, name: 'Pineapple',  radius: 82, score: 45,  color: '#ffd32a', dark: '#cc9e00', light: '#fff099' },
            { tier: 9, name: 'Melon',      radius: 95, score: 55,  color: '#7bed9f', dark: '#3ca860', light: '#bdffd1' },
            { tier: 10, name: 'Watermelon',radius: 110, score: 66, color: '#2ed573', dark: '#168743', light: '#7ef5ad' }
        ];

        /**
         * Renders high-detail cute vector artwork for any fruit tier at (0,0) with radius r.
         */
        function drawFruitArtwork(ctx, tier, r, scaleAnim = 1) {
            const f = FRUITS[tier];
            ctx.save();
            ctx.scale(scaleAnim, scaleAnim);

            // Base Radial Gradient Body
            const grad = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
            grad.addColorStop(0, f.light);
            grad.addColorStop(0.55, f.color);
            grad.addColorStop(1, f.dark);

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fill();

            // Subtle outline for crisp separation
            ctx.lineWidth = Math.max(1.5, r * 0.035);
            ctx.strokeStyle = f.dark;
            ctx.stroke();

            // Tier-specific botanical details
            if (tier === 0) {
                // Cherry stem
                ctx.strokeStyle = '#6b4423';
                ctx.lineWidth = 2.2;
                ctx.beginPath();
                ctx.moveTo(0, -r * 0.75);
                ctx.quadraticCurveTo(r * 0.3, -r * 1.35, r * 0.7, -r * 1.25);
                ctx.stroke();
            } else if (tier === 1) {
                // Strawberry seeds & leafy crown
                ctx.fillStyle = '#ffeaa7';
                const seedAngles = [-0.6, 0, 0.6, -0.35, 0.35];
                const seedY = [-0.15, -0.25, -0.15, 0.35, 0.35];
                for (let i = 0; i < seedAngles.length; i++) {
                    ctx.beginPath();
                    ctx.ellipse(seedAngles[i] * r * 0.7, seedY[i] * r * 0.7, 1.3, 2.2, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                // Green crown
                ctx.fillStyle = '#2ed573';
                ctx.beginPath();
                ctx.moveTo(-r * 0.45, -r * 0.85);
                ctx.lineTo(0, -r * 0.6);
                ctx.lineTo(r * 0.45, -r * 0.85);
                ctx.lineTo(0, -r * 1.05);
                ctx.closePath();
                ctx.fill();
            } else if (tier === 2) {
                // Grape cluster highlight bubbles & stem
                ctx.fillStyle = 'rgba(255,255,255,0.22)';
                ctx.beginPath();
                ctx.arc(-r * 0.35, -r * 0.25, r * 0.25, 0, Math.PI * 2);
                ctx.arc(r * 0.3, -r * 0.3, r * 0.22, 0, Math.PI * 2);
                ctx.arc(0, r * 0.35, r * 0.26, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#5c3a21';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(0, -r * 0.85);
                ctx.lineTo(0, -r * 1.15);
                ctx.stroke();
            } else if (tier === 3) {
                // Dekopon top bump & green leaf
                ctx.fillStyle = f.color;
                ctx.beginPath();
                ctx.arc(0, -r * 0.88, r * 0.26, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#2ed573';
                ctx.beginPath();
                ctx.ellipse(r * 0.28, -r * 0.95, r * 0.24, r * 0.11, -0.4, 0, Math.PI * 2);
                ctx.fill();
            } else if (tier === 4) {
                // Orange citrus dimples & leaf
                ctx.fillStyle = 'rgba(180, 60, 0, 0.22)';
                ctx.beginPath();
                ctx.arc(-r * 0.45, r * 0.2, 2, 0, Math.PI * 2);
                ctx.arc(r * 0.48, r * 0.15, 2, 0, Math.PI * 2);
                ctx.arc(0, r * 0.55, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#26de81';
                ctx.beginPath();
                ctx.ellipse(r * 0.2, -r * 0.95, r * 0.26, r * 0.12, -0.3, 0, Math.PI * 2);
                ctx.fill();
            } else if (tier === 5) {
                // Apple stem & leaf
                ctx.strokeStyle = '#6b4423';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(0, -r * 0.82);
                ctx.lineTo(r * 0.08, -r * 1.12);
                ctx.stroke();
                ctx.fillStyle = '#2ed573';
                ctx.beginPath();
                ctx.ellipse(r * 0.26, -r * 0.98, r * 0.22, r * 0.1, -0.35, 0, Math.PI * 2);
                ctx.fill();
            } else if (tier === 6) {
                // Pear speckles & stem
                ctx.fillStyle = 'rgba(120, 130, 20, 0.25)';
                ctx.beginPath();
                ctx.arc(-r * 0.4, r * 0.3, 2.2, 0, Math.PI * 2);
                ctx.arc(r * 0.42, r * 0.25, 2.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#6b4423';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(0, -r * 0.85);
                ctx.lineTo(-r * 0.06, -r * 1.12);
                ctx.stroke();
            } else if (tier === 7) {
                // Peach cleft crease
                ctx.strokeStyle = 'rgba(190, 60, 90, 0.35)';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(0, -r * 0.1, r * 0.72, -Math.PI * 0.48, Math.PI * 0.12);
                ctx.stroke();
            } else if (tier === 8) {
                // Pineapple diamond crosshatch & spiky crown
                ctx.save();
                ctx.beginPath();
                ctx.arc(0, 0, r * 0.96, 0, Math.PI * 2);
                ctx.clip();
                ctx.strokeStyle = 'rgba(180, 120, 0, 0.28)';
                ctx.lineWidth = 2;
                for (let i = -r; i <= r; i += r * 0.42) {
                    ctx.beginPath();
                    ctx.moveTo(i - r, -r);
                    ctx.lineTo(i + r, r);
                    ctx.moveTo(i + r, -r);
                    ctx.lineTo(i - r, r);
                    ctx.stroke();
                }
                ctx.restore();
                // Crown leaves
                ctx.fillStyle = '#20bf6b';
                ctx.beginPath();
                ctx.moveTo(-r * 0.32, -r * 0.88);
                ctx.lineTo(-r * 0.18, -r * 1.22);
                ctx.lineTo(0, -r * 0.95);
                ctx.lineTo(0, -r * 1.28);
                ctx.lineTo(r * 0.18, -r * 0.95);
                ctx.lineTo(r * 0.32, -r * 1.22);
                ctx.lineTo(r * 0.25, -r * 0.86);
                ctx.closePath();
                ctx.fill();
            } else if (tier === 9) {
                // Melon netted texture lines
                ctx.save();
                ctx.beginPath();
                ctx.arc(0, 0, r * 0.95, 0, Math.PI * 2);
                ctx.clip();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.38)';
                ctx.lineWidth = 2.2;
                for (let i = -r; i <= r; i += r * 0.38) {
                    ctx.beginPath();
                    ctx.moveTo(i, -r);
                    ctx.lineTo(i, r);
                    ctx.moveTo(-r, i);
                    ctx.lineTo(r, i);
                    ctx.stroke();
                }
                ctx.restore();
            } else if (tier === 10) {
                // Watermelon dark green wavy stripes
                ctx.save();
                ctx.beginPath();
                ctx.arc(0, 0, r * 0.97, 0, Math.PI * 2);
                ctx.clip();
                ctx.strokeStyle = '#116934';
                ctx.lineWidth = r * 0.11;
                ctx.lineCap = 'round';
                for (let offset of [-0.55, 0, 0.55]) {
                    ctx.beginPath();
                    ctx.moveTo(offset * r, -r);
                    ctx.quadraticCurveTo(offset * r * 1.35, 0, offset * r, r);
                    ctx.stroke();
                }
                ctx.restore();
            }

            // Glossy Specular Highlight
            ctx.fillStyle = 'rgba(255, 255, 255, 0.38)';
            ctx.beginPath();
            ctx.ellipse(-r * 0.34, -r * 0.36, r * 0.22, r * 0.12, -Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();

            // Cute Kawaii Face (scales proportionally with fruit size)
            if (r >= 14) {
                const eyeOffsetX = r * 0.26;
                const eyeOffsetY = r * 0.04;
                const eyeR = Math.max(1.8, r * 0.075);

                // Eyes
                ctx.fillStyle = '#3d2314';
                ctx.beginPath();
                ctx.arc(-eyeOffsetX, eyeOffsetY, eyeR, 0, Math.PI * 2);
                ctx.arc(eyeOffsetX, eyeOffsetY, eyeR, 0, Math.PI * 2);
                ctx.fill();

                // Eye sparkle
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(-eyeOffsetX - eyeR * 0.3, eyeOffsetY - eyeR * 0.3, eyeR * 0.35, 0, Math.PI * 2);
                ctx.arc(eyeOffsetX - eyeR * 0.3, eyeOffsetY - eyeR * 0.3, eyeR * 0.35, 0, Math.PI * 2);
                ctx.fill();

                // Rosy cheeks
                ctx.fillStyle = 'rgba(255, 105, 135, 0.45)';
                ctx.beginPath();
                ctx.ellipse(-eyeOffsetX * 1.25, eyeOffsetY + r * 0.14, eyeR * 1.3, eyeR * 0.8, 0, 0, Math.PI * 2);
                ctx.ellipse(eyeOffsetX * 1.25, eyeOffsetY + r * 0.14, eyeR * 1.3, eyeR * 0.8, 0, 0, Math.PI * 2);
                ctx.fill();

                // Happy little smile
                ctx.strokeStyle = '#3d2314';
                ctx.lineWidth = Math.max(1.4, r * 0.045);
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.arc(0, eyeOffsetY + r * 0.08, r * 0.13, 0.15 * Math.PI, 0.85 * Math.PI);
                ctx.stroke();
            }

            ctx.restore();
        }

        /**
         * ============================================================================
         * 2. SYNTHESIZED SOUND ENGINE (Web Audio API - Zero External Files)
         * ============================================================================
         */
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.muted = localStorage.getItem('suika_muted') === 'true';
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) {
                        this.ctx = new AudioCtx();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            toggleMute() {
                this.muted = !this.muted;
                localStorage.setItem('suika_muted', this.muted);
                return this.muted;
            }

            playDrop() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(340, now);
                osc.frequency.exponentialRampToValueAtTime(140, now + 0.11);

                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.12);
            }

            playMerge(tier) {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                // Pentatonic ascending pitch based on merged fruit tier
                const baseFreq = 280 * Math.pow(1.12, tier);

                const osc = this.ctx.createOscillator();
                const osc2 = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(baseFreq, now);
                osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.45, now + 0.18);

                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(baseFreq * 1.5, now + 0.04);
                osc2.frequency.exponentialRampToValueAtTime(baseFreq * 2, now + 0.22);

                gain.gain.setValueAtTime(0.22, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);

                osc.connect(gain);
                osc2.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc2.start(now + 0.04);
                osc.stop(now + 0.25);
                osc2.stop(now + 0.25);
            }

            playGameOver() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const notes = [392, 349.23, 329.63, 261.63];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.14);

                    gain.gain.setValueAtTime(0.18, now + idx * 0.14);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.14 + 0.25);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.14);
                    osc.stop(now + idx * 0.14 + 0.26);
                });
            }
        }

        const sfx = new SoundFX();

        /**
         * ============================================================================
         * 3. MAIN GAME ENGINE & PHYSICS CONTROLLER
         * ============================================================================
         */
        const { Engine, World, Bodies, Body, Events, Composite } = Matter;

        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('next-canvas');
        const nextCtx = nextCanvas.getContext('2d');
        const legendCanvas = document.getElementById('legend-canvas');
        const legendCtx = legendCanvas.getContext('2d');

        // Game State
        let engine, world;
        let renderScale = 1;
        let score = 0;
        let bestScore = parseInt(localStorage.getItem('suika_best_score') || '0', 10);
        let currentTier = 0;
        let nextTier = 0;
        let aimX = LOGICAL_WIDTH / 2;
        let canDrop = true;
        let dropCooldownTimer = null;
        let isDragging = false;
        let isGameOver = false;
        let dangerTimer = 0; // Seconds spent above danger line
        let lastFrameTime = performance.now();

        // Visual Effects Arrays
        let particles = [];
        let floatingTexts = [];
        let fruitAnimations = new Map(); // body.id -> { scale: number }

        // Initialize UI Best Score
        document.getElementById('best-val').textContent = bestScore;
        updateSoundIcons();

        function updateSoundIcons() {
            document.getElementById('icon-sound-on').style.display = sfx.muted ? 'none' : 'block';
            document.getElementById('icon-sound-off').style.display = sfx.muted ? 'block' : 'none';
        }

        function getRandomDroppableTier() {
            // Only tiers 0 through 4 (Cherry to Orange) spawn
            return Math.floor(Math.random() * 5);
        }

        function clampAimX(x, tier) {
            const r = FRUITS[tier].radius;
            const minX = r + 6;
            const maxX = LOGICAL_WIDTH - r - 6;
            return Math.max(minX, Math.min(maxX, x));
        }

        function setupPhysics() {
            engine = Engine.create({
                positionIterations: 8,
                velocityIterations: 6
            });
            world = engine.world;
            engine.gravity.y = 1.15;

            // Invisible Static Jar Boundaries (Left, Right, Bottom)
            const wallOptions = {
                isStatic: true,
                friction: 0.15,
                restitution: 0.1,
                label: 'wall'
            };

            const leftWall = Bodies.rectangle(
                -WALL_THICKNESS / 2,
                LOGICAL_HEIGHT / 2,
                WALL_THICKNESS,
                LOGICAL_HEIGHT * 2,
                wallOptions
            );
            const rightWall = Bodies.rectangle(
                LOGICAL_WIDTH + WALL_THICKNESS / 2,
                LOGICAL_HEIGHT / 2,
                WALL_THICKNESS,
                LOGICAL_HEIGHT * 2,
                wallOptions
            );
            const floor = Bodies.rectangle(
                LOGICAL_WIDTH / 2,
                LOGICAL_HEIGHT + WALL_THICKNESS / 2 - 8,
                LOGICAL_WIDTH + WALL_THICKNESS * 2,
                WALL_THICKNESS,
                wallOptions
            );

            World.add(world, [leftWall, rightWall, floor]);

            // Collision Event Handler for Same-Tier Fruit Merging
            Events.on(engine, 'collisionStart', (event) => {
                if (isGameOver) return;
                const pairs = event.pairs;

                for (let i = 0; i < pairs.length; i++) {
                    const { bodyA, bodyB } = pairs[i];

                    if (
                        bodyA.isFruit &&
                        bodyB.isFruit &&
                        !bodyA.isMerging &&
                        !bodyB.isMerging &&
                        bodyA.tier === bodyB.tier
                    ) {
                        // Mark immediately so they don't trigger multiple merges in one tick
                        bodyA.isMerging = true;
                        bodyB.isMerging = true;

                        handleFruitMerge(bodyA, bodyB);
                    }
                }
            });
        }

        function handleFruitMerge(bodyA, bodyB) {
            const tier = bodyA.tier;
            const midX = (bodyA.position.x + bodyB.position.x) / 2;
            const midY = (bodyA.position.y + bodyB.position.y) / 2;

            // Remove old fruits from Matter world
            World.remove(world, [bodyA, bodyB]);
            fruitAnimations.delete(bodyA.id);
            fruitAnimations.delete(bodyB.id);

            sfx.playMerge(tier);

            if (tier < FRUITS.length - 1) {
                // Spawn next tier fruit
                const nextT = tier + 1;
                const newFruit = createFruitBody(midX, midY, nextT);
                World.add(world, newFruit);
                fruitAnimations.set(newFruit.id, { scale: 0.35 });

                // Gentle outward pop impulse on nearby fruits for tactile feel
                applyPopImpulse(midX, midY, FRUITS[nextT].radius * 1.6);

                // Particle burst & floating score
                const pts = FRUITS[nextT].score;
                addScore(pts);
                spawnParticles(midX, midY, FRUITS[nextT].color, 14);
                spawnFloatingText(midX, midY, `+${pts}`, FRUITS[nextT].dark);
            } else {
                // Two Watermelons merged! Mega celebration & +1000 bonus
                applyPopImpulse(midX, midY, 180);
                addScore(1000);
                spawnParticles(midX, midY, '#2ed573', 30);
                spawnParticles(midX, midY, '#ff4757', 20);
                spawnFloatingText(midX, midY, '+1000 MEGA!', '#e0533c');
            }
        }

        function applyPopImpulse(x, y, radius) {
            const bodies = Composite.allBodies(world);
            for (const b of bodies) {
                if (!b.isFruit) continue;
                const dx = b.position.x - x;
                const dy = b.position.y - y;
                const dist = Math.hypot(dx, dy);
                if (dist > 0.1 && dist < radius) {
                    const forceMag = (1 - dist / radius) * 0.018 * b.mass;
                    Body.applyForce(b, b.position, {
                        x: (dx / dist) * forceMag,
                        y: (dy / dist) * forceMag - 0.005 * b.mass
                    });
                }
            }
        }

        function createFruitBody(x, y, tier) {
            const r = FRUITS[tier].radius;
            const body = Bodies.circle(x, y, r, {
                restitution: 0.2,
                friction: 0.12,
                frictionAir: 0.004,
                density: 0.0012 * (1 + tier * 0.08),
                label: 'fruit'
            });
            body.isFruit = true;
            body.tier = tier;
            body.isMerging = false;
            body.spawnTime = performance.now();
            return body;
        }

        function dropCurrentFruit() {
            if (!canDrop || isGameOver) return;

            sfx.playDrop();
            canDrop = false;

            const safeX = clampAimX(aimX, currentTier);
            const fruit = createFruitBody(safeX, DROP_Y, currentTier);
            World.add(world, fruit);
            fruitAnimations.set(fruit.id, { scale: 0.85 });

            // Advance queue
            currentTier = nextTier;
            nextTier = getRandomDroppableTier();
            aimX = clampAimX(aimX, currentTier);
            drawNextPreview();

            // Cooldown prevents accidental double taps
            clearTimeout(dropCooldownTimer);
            dropCooldownTimer = setTimeout(() => {
                canDrop = true;
            }, 420);
        }

        function addScore(points) {
            score += points;
            document.getElementById('score-val').textContent = score;
            if (score > bestScore) {
                bestScore = score;
                document.getElementById('best-val').textContent = bestScore;
                localStorage.setItem('suika_best_score', bestScore);
            }
        }

        function spawnParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
                const speed = 1.5 + Math.random() * 4.2;
                particles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * speed,
                    y_vel: Math.sin(angle) * speed - 1,
                    r: 3 + Math.random() * 4,
                    color,
                    alpha: 1,
                    decay: 0.025 + Math.random() * 0.02
                });
            }
        }

        function spawnFloatingText(x, y, text, color) {
            floatingTexts.push({
                x,
                y,
                text,
                color,
                alpha: 1,
                vy: -1.4
            });
        }

        function resetGame() {
            if (engine) {
                World.clear(world);
                Engine.clear(engine);
            }
            particles = [];
            floatingTexts = [];
            fruitAnimations.clear();
            score = 0;
            dangerTimer = 0;
            isGameOver = false;
            canDrop = true;
            document.getElementById('score-val').textContent = '0';
            document.getElementById('gameover-modal').classList.remove('active');
            document.getElementById('restart-modal').classList.remove('active');

            currentTier = getRandomDroppableTier();
            nextTier = getRandomDroppableTier();
            aimX = LOGICAL_WIDTH / 2;

            setupPhysics();
            drawNextPreview();
        }

        function triggerGameOver() {
            if (isGameOver) return;
            isGameOver = true;
            sfx.playGameOver();

            document.getElementById('final-score').textContent = score;
            document.getElementById('final-best').textContent = bestScore;
            const badge = document.getElementById('new-best-badge');
            badge.style.display = (score > 0 && score >= bestScore) ? 'inline-block' : 'none';
            document.getElementById('gameover-modal').classList.add('active');
        }

        /**
         * ============================================================================
         * 4. RESPONSIVE CANVAS SIZING & RENDER LOOP
         * ============================================================================
         */
        function resizeCanvases() {
            const wrapper = document.getElementById('game-wrapper');
            const availW = wrapper.clientWidth - 24;
            const availH = wrapper.clientHeight - 8;

            const aspect = LOGICAL_WIDTH / LOGICAL_HEIGHT;
            let displayW = availW;
            let displayH = displayW / aspect;

            if (displayH > availH) {
                displayH = availH;
                displayW = displayH * aspect;
            }

            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.style.width = `${Math.floor(displayW)}px`;
            canvas.style.height = `${Math.floor(displayH)}px`;
            canvas.width = Math.floor(displayW * dpr);
            canvas.height = Math.floor(displayH * dpr);

            renderScale = canvas.width / LOGICAL_WIDTH;

            drawLegendBar();
            drawNextPreview();
        }

        function drawNextPreview() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            nextCanvas.width = 34 * dpr;
            nextCanvas.height = 34 * dpr;
            nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);

            nextCtx.save();
            nextCtx.translate(nextCanvas.width / 2, nextCanvas.height / 2);
            const previewR = 12 * dpr;
            const scaleFactor = previewR / FRUITS[nextTier].radius;
            nextCtx.scale(scaleFactor, scaleFactor);
            drawFruitArtwork(nextCtx, nextTier, FRUITS[nextTier].radius);
            nextCtx.restore();
        }

        function drawLegendBar() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const rect = legendCanvas.getBoundingClientRect();
            if (rect.width === 0) return;
            legendCanvas.width = rect.width * dpr;
            legendCanvas.height = 30 * dpr;

            legendCtx.clearRect(0, 0, legendCanvas.width, legendCanvas.height);
            const count = FRUITS.length;
            const stepX = legendCanvas.width / (count + 0.4);

            for (let i = 0; i < count; i++) {
                const cx = stepX * (i + 0.7);
                const cy = legendCanvas.height / 2;
                // Gradually scale icon size from left (Cherry) to right (Watermelon)
                const targetR = (7.5 + i * 0.42) * dpr;
                const scaleFactor = targetR / FRUITS[i].radius;

                legendCtx.save();
                legendCtx.translate(cx, cy);
                legendCtx.scale(scaleFactor, scaleFactor);
                drawFruitArtwork(legendCtx, i, FRUITS[i].radius);
                legendCtx.restore();

                // Tiny arrow indicator between fruits
                if (i < count - 1) {
                    legendCtx.fillStyle = '#c58f53';
                    legendCtx.beginPath();
                    const ax = cx + stepX * 0.5;
                    legendCtx.moveTo(ax - 2 * dpr, cy - 2.5 * dpr);
                    legendCtx.lineTo(ax + 2 * dpr, cy);
                    legendCtx.lineTo(ax - 2 * dpr, cy + 2.5 * dpr);
                    legendCtx.fill();
                }
            }
        }

        function renderScene(now) {
            const dt = Math.min((now - lastFrameTime) / 1000, 0.05);
            lastFrameTime = now;

            if (!isGameOver) {
                Engine.update(engine, 1000 / 60);
            }

            ctx.save();
            ctx.scale(renderScale, renderScale);

            // 1. Jar Background Interior
            const jarGrad = ctx.createLinearGradient(0, 0, 0, LOGICAL_HEIGHT);
            jarGrad.addColorStop(0, 'rgba(255, 250, 238, 0.92)');
            jarGrad.addColorStop(1, 'rgba(247, 227, 188, 0.96)');
            ctx.fillStyle = jarGrad;
            ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);

            // Subtle glass vertical reflection strips
            ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
            ctx.fillRect(14, 10, 12, LOGICAL_HEIGHT - 25);
            ctx.fillRect(LOGICAL_WIDTH - 22, 10, 6, LOGICAL_HEIGHT - 25);

            // 2. Danger Line (Dashed Red Line)
            const isDangerActive = dangerTimer > 0.25;
            const pulseAlpha = isDangerActive ? (0.5 + 0.5 * Math.sin(now * 0.015)) : 0.45;
            ctx.save();
            ctx.strokeStyle = `rgba(235, 59, 59, ${pulseAlpha})`;
            ctx.lineWidth = isDangerActive ? 3 : 2;
            ctx.setLineDash([8, 6]);
            ctx.beginPath();
            ctx.moveTo(10, DANGER_LINE_Y);
            ctx.lineTo(LOGICAL_WIDTH - 10, DANGER_LINE_Y);
            ctx.stroke();
            ctx.restore();

            // 3. Aim Guide Line & Held Preview Fruit
            if (canDrop && !isGameOver) {
                const safeX = clampAimX(aimX, currentTier);
                const r = FRUITS[currentTier].radius;

                // Vertical drop guide line
                ctx.save();
                ctx.strokeStyle = 'rgba(158, 107, 59, 0.35)';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(safeX, DROP_Y + r);
                ctx.lineTo(safeX, LOGICAL_HEIGHT - 12);
                ctx.stroke();
                ctx.restore();

                // Preview fruit ready to drop
                ctx.save();
                ctx.translate(safeX, DROP_Y);
                drawFruitArtwork(ctx, currentTier, r);
                ctx.restore();
            }

            // 4. Render All Physics Fruits & Check Danger Line Overflow
            const bodies = Composite.allBodies(world);
            let anyFruitAboveDanger = false;

            for (const b of bodies) {
                if (!b.isFruit) continue;

                // Smooth pop-in scale animation when created/merged
                let anim = fruitAnimations.get(b.id);
                let currentScale = 1;
                if (anim) {
                    anim.scale += (1 - anim.scale) * 0.25;
                    if (Math.abs(1 - anim.scale) < 0.01) {
                        fruitAnimations.delete(b.id);
                    } else {
                        currentScale = anim.scale;
                    }
                }

                ctx.save();
                ctx.translate(b.position.x, b.position.y);
                ctx.rotate(b.angle);
                drawFruitArtwork(ctx, b.tier, FRUITS[b.tier].radius, currentScale);
                ctx.restore();

                // Check if settled fruit breaches danger line (ignore newly dropped fruit for 1.1s)
                const age = (now - b.spawnTime) / 1000;
                const topEdge = b.position.y - FRUITS[b.tier].radius;
                if (age > 1.1 && topEdge < DANGER_LINE_Y && b.speed < 1.8) {
                    anyFruitAboveDanger = true;
                }
            }

            // Danger Timer Logic (2.5 seconds grace period)
            if (!isGameOver) {
                if (anyFruitAboveDanger) {
                    dangerTimer += dt;
                    // Draw countdown warning badge
                    const remaining = Math.max(0, 2.5 - dangerTimer).toFixed(1);
                    ctx.save();
                    ctx.fillStyle = 'rgba(235, 59, 59, 0.9)';
                    ctx.beginPath();
                    ctx.roundRect(LOGICAL_WIDTH / 2 - 58, DANGER_LINE_Y - 26, 116, 22, 11);
                    ctx.fill();
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '700 12px Fredoka, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(`DANGER! ${remaining}s`, LOGICAL_WIDTH / 2, DANGER_LINE_Y - 11);
                    ctx.restore();

                    if (dangerTimer >= 2.5) {
                        triggerGameOver();
                    }
                } else {
                    dangerTimer = Math.max(0, dangerTimer - dt * 2);
                }
            }

            // 5. Render Merge Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.y_vel;
                p.y_vel += 0.15; // slight gravity
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // 6. Render Floating Score Popups
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.y += ft.vy;
                ft.alpha -= 0.022;

                if (ft.alpha <= 0) {
                    floatingTexts.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = ft.alpha;
                ctx.font = '700 18px Fredoka, sans-serif';
                ctx.textAlign = 'center';
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#ffffff';
                ctx.strokeText(ft.text, ft.x, ft.y);
                ctx.fillStyle = ft.color;
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            }

            // 7. Wooden Jar Border Frame
            ctx.strokeStyle = '#c58f53';
            ctx.lineWidth = 10;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, LOGICAL_HEIGHT - 4);
            ctx.lineTo(LOGICAL_WIDTH, LOGICAL_HEIGHT - 4);
            ctx.lineTo(LOGICAL_WIDTH, 0);
            ctx.stroke();

            ctx.restore();

            requestAnimationFrame(renderScene);
        }

        /**
         * ============================================================================
         * 5. TOUCH & MOUSE INPUT HANDLERS
         * ============================================================================
         */
        function pointerToLogicalX(clientX) {
            const rect = canvas.getBoundingClientRect();
            const relX = (clientX - rect.left) / rect.width;
            return relX * LOGICAL_WIDTH;
        }

        function onPointerDown(e) {
            if (isGameOver) return;
            sfx.init(); // Unlock Web Audio on first user touch
            isDragging = true;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            aimX = clampAimX(pointerToLogicalX(clientX), currentTier);
        }

        function onPointerMove(e) {
            if (!isDragging || isGameOver) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            aimX = clampAimX(pointerToLogicalX(clientX), currentTier);
        }

        function onPointerUp() {
            if (!isDragging || isGameOver) return;
            isDragging = false;
            dropCurrentFruit();
        }

        // Attach pointer listeners to the game wrapper so dragging anywhere near the jar works effortlessly
        const gameWrapper = document.getElementById('game-wrapper');
        gameWrapper.addEventListener('touchstart', onPointerDown, { passive: true });
        gameWrapper.addEventListener('touchmove', onPointerMove, { passive: true });
        gameWrapper.addEventListener('touchend', onPointerUp);

        gameWrapper.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);

        // UI Button Listeners
        document.getElementById('btn-sound').addEventListener('click', () => {
            sfx.init();
            sfx.toggleMute();
            updateSoundIcons();
        });

        document.getElementById('btn-restart').addEventListener('click', () => {
            document.getElementById('restart-modal').classList.add('active');
        });

        document.getElementById('btn-cancel-restart').addEventListener('click', () => {
            document.getElementById('restart-modal').classList.remove('active');
        });

        document.getElementById('btn-confirm-restart').addEventListener('click', () => {
            resetGame();
        });

        document.getElementById('btn-play-again').addEventListener('click', () => {
            resetGame();
        });

        // Boot Game on Window Load
        window.addEventListener('resize', resizeCanvases);
        window.onload = () => {
            resizeCanvases();
            resetGame();
            requestAnimationFrame(renderScene);
        };
    </script>
</body>
</html>
